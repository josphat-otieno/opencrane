<section class="wo-history" aria-labelledby="conversation-history-label">
	<header id="conversation-history-label">Conversations</header>
	@if (entries().length === 0) {
		<p>No conversations yet</p>
	} @else {
		<nav aria-label="Conversation history">
			@for (entry of entries(); track entry.threadId) {
				<a [routerLink]="['/conversation', entry.threadId]" routerLinkActive="wo-history__entry--active">
					<span>{{ entry.title }}</span>
					@if (entry.recency) { <small>{{ entry.recency }}</small> }
				</a>
			}
		</nav>
	}
</section>
